apiVersion: v1
kind: Pod
metadata:
  name: env-demo
spec:
  containers:
    - name: env-demo
      image: busybox:latest
      command: ["sh", "-c"]
      args: ["echo $APP_NAME; echo $APP_ENV; sleep 300"]
      env:
        - name: APP_NAME
          value: "NovaPay"
        - name: APP_ENV
          value: "development"

        

